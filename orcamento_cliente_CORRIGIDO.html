<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Orçamento - Volaty Turismo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1A1A; --panel:#2D2D2D; --panel-2:#3A3A3A; --field:#252525;
    --red:#E74C3C; --red-dim:#C23B2F; --green:#34D399; --green-dim:#1D5B45;
    --blue:#60A5FA; --blue-dim:#1E3A5F;
    --ink:#FFFFFF; --muted:#B0B0B0; --line:#404040; --danger:#F87171;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(135deg, rgba(26,26,26,0.93) 0%, rgba(45,45,45,0.90) 100%), url('airport-bg.jpg') center/cover fixed;
    background-attachment: fixed;
    color:var(--ink); font-family:'Manrope',sans-serif; min-height:100vh; padding:20px;
  }
  .container{ max-width:700px; margin:0 auto; }
  
  .top{ padding:22px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; margin-bottom:20px; background:rgba(0,0,0,0.3); border-radius:12px 12px 0 0; }
  .top .tag{ font-family:'Space Mono',monospace; font-size:11px; color:#000; background:var(--red); padding:4px 10px; border-radius:6px; font-weight:700; letter-spacing:.06em; }
  .top h1{ font-size:18px; margin:0; font-weight:800; }
  .top p{ margin:2px 0 0; font-size:13px; color:var(--muted); }

  .quote-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:20px; }
  .quote-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:15px; }
  .quote-client{ font-weight:800; font-size:15px; }
  .quote-route{ font-family:'Space Mono',monospace; font-size:13px; color:var(--muted); margin-top:4px; }
  
  .meta-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px; font-size:12px; }
  .meta-item{ background:var(--field); padding:12px; border-radius:8px; border-left:3px solid var(--red); }
  .meta-label{ color:var(--muted); font-size:11px; text-transform:uppercase; margin-bottom:4px; letter-spacing:.05em; font-weight:600; }
  .meta-value{ color:var(--ink); font-weight:700; font-size:13px; }

  .options-title{ font-size:15px; font-weight:800; margin:30px 0 15px; color:var(--ink); }
  
  .option-card{ 
    background:var(--panel); border:1.5px solid var(--line); border-radius:12px; padding:18px; 
    margin-bottom:12px; cursor:pointer; transition:all .2s ease; position:relative;
  }
  .option-card:hover{ 
    border-color:var(--red); transform:translateY(-2px); background:var(--panel-2); 
  }
  .option-card.selected{ 
    border-color:var(--green); background:rgba(52,211,153,0.08); 
  }
  .option-card.disabled{
    opacity: 0.6;
    cursor: not-allowed;
  }

  .option-check{
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    background: var(--green);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    display: none;
  }
  .option-card.selected .option-check{
    display: flex;
  }

  .option-header{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .option-icon{ font-size:28px; }
  .option-name{ font-weight:700; font-size:16px; color:var(--ink); }
  .option-sub{ font-size:13px; color:var(--muted); margin-bottom:12px; }
  .option-price{ font-size:22px; font-weight:800; color:var(--red); font-family:'Space Mono',monospace; }

  .empty{ color:var(--muted); font-size:14px; padding:40px 20px; text-align:center; background:var(--panel); border:1px dashed var(--line); border-radius:14px; }
  
  .loading{ text-align:center; padding:40px 20px; }
  .spinner{ display:inline-block; width:36px; height:36px; border:3px solid var(--line); border-top-color:var(--red); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .success-message{ 
    background:rgba(52,211,153,0.15); border:1px solid var(--green); border-radius:12px; 
    padding:18px; margin-top:20px; display:none; 
  }
  .success-message.show{ display:block; animation:slideIn .3s ease; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
  .success-icon{ font-size:24px; margin-bottom:8px; }
  .success-text{ color:var(--green); font-size:14px; line-height:1.6; }

  .setup-banner{
    margin: 0 0 20px; background: rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.35);
    border-radius:12px; padding:14px 16px; font-size:12px; color:#FCA5A5; line-height:1.6; display:none;
  }

  .back-link{ color:var(--red); text-decoration:none; font-size:13px; margin-bottom:20px; display:inline-flex; align-items:center; gap:6px; font-weight:600; }
  .back-link:hover{ text-decoration:underline; }

  .button-group{ display:flex; gap:10px; margin-top:30px; }
  .btn{ border:none; border-radius:10px; padding:12px 16px; font-weight:700; font-size:13px; cursor:pointer; font-family:'Manrope',sans-serif; transition:all .15s ease; width:100%; }
  .btn:active{ transform:scale(0.98); }
  .btn-secondary{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-secondary:hover{ border-color:var(--red); color:var(--red); }
</style>
</head>
<body>

<div class="container">
  <a href="javascript:history.back()" class="back-link">← Voltar</a>

  <div class="top">
    <span class="tag">✈ VOLATY</span>
    <div>
      <h1>Seu Orçamento de Viagem</h1>
      <p>Escolha a melhor opção para você</p>
    </div>
  </div>

  <div class="setup-banner" id="setupBanner">
    ⚠️ Firebase não foi configurado corretamente. Verifique a conexão.
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p style="margin-top:16px; color:var(--muted); font-size:13px;">Carregando seu orçamento...</p>
    </div>
  </div>
</div>

<script type="module">
  // ============================================================
  // FIREBASE CONFIGURATION
  // ============================================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBhdZWn2O1gcOOdfVmJU7VOw0F3T-Ja-Yc",
    authDomain: "volaty-c0808.firebaseapp.com",
    databaseURL: "https://volaty-c0808-default-rtdb.firebaseio.com",
    projectId: "volaty-c0808",
    storageBucket: "volaty-c0808.firebasestorage.app",
    messagingSenderId: "140086466923",
    appId: "1:140086466923:web:1caa0fee969b601722142e"
  };
  // ============================================================

  let db = null;
  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
  } catch (e) {
    document.getElementById('setupBanner').style.display = 'block';
  }

  function getUrlParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  async function loadQuote() {
    const quoteId = getUrlParam('id');
    if (!quoteId || !db) {
      document.getElementById('content').innerHTML = '<div class="empty">ID de orçamento não encontrado ou Firebase não configurado.</div>';
      return;
    }

    try {
      const quoteRef = ref(db, 'orcamentos/' + quoteId);
      const snapshot = await get(quoteRef);

      if (!snapshot.exists()) {
        document.getElementById('content').innerHTML = '<div class="empty">Orçamento não encontrado. Verifique o link e tente novamente.</div>';
        return;
      }

      const quote = snapshot.val();
      
      // Marcar como visualizado
      try {
        await update(ref(db, 'orcamentos/' + quoteId), { viewedAt: Date.now() });
      } catch(e) {}

      renderQuote(quote, quoteId);
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="empty">Erro ao carregar orçamento: ' + e.message + '</div>';
    }
  }

  function renderQuote(quote, quoteId) {
    const fares = quote.fares || [];
    
    const metaHtml = `
      <div class="meta-row">
        <div class="meta-item">
          <div class="meta-label">Agência</div>
          <div class="meta-value">${escapeHtml(quote.agencyName || 'Volaty Turismo')}</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Data</div>
          <div class="meta-value">${escapeHtml(quote.date || '-')}</div>
        </div>
      </div>

      <div class="meta-row">
        <div class="meta-item">
          <div class="meta-label">Origem</div>
          <div class="meta-value">${escapeHtml(quote.origin?.city || '-')}</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Destino</div>
          <div class="meta-value">${escapeHtml(quote.destination?.city || '-')}</div>
        </div>
      </div>

      ${quote.departure || quote.arrival ? `
      <div class="meta-row">
        ${quote.departure ? `<div class="meta-item"><div class="meta-label">Partida</div><div class="meta-value">${escapeHtml(quote.departure)}</div></div>` : '<div></div>'}
        ${quote.arrival ? `<div class="meta-item"><div class="meta-label">Chegada</div><div class="meta-value">${escapeHtml(quote.arrival)}</div></div>` : '<div></div>'}
      </div>
      ` : ''}
    `;
    
    const html = `
      <div class="quote-card">
        <div class="quote-top">
          <div>
            <div class="quote-client">${escapeHtml(quote.clientName || 'Sem nome')}</div>
            <div class="quote-route">${escapeHtml((quote.origin&&quote.origin.code)||'?')} → ${escapeHtml((quote.destination&&quote.destination.code)||'?')}</div>
          </div>
        </div>
        ${metaHtml}
      </div>

      <div class="options-title">Escolha uma opção:</div>

      ${fares.length > 0 ? fares.map((fare, i) => `
        <div class="option-card" onclick="selectFare('${quoteId}', '${fare.id}', ${i})" data-fare="${fare.id}">
          <div class="option-check">✓</div>
          <div class="option-header">
            <div class="option-icon">${escapeHtml(fare.icon || '✈')}</div>
            <div class="option-name">${escapeHtml(fare.label || 'Opção')}</div>
          </div>
          <div class="option-sub">${escapeHtml(fare.sub || '')}</div>
          <div class="option-price">R$ ${formatCurrency(fare.price)}</div>
        </div>
      `).join('') : '<div class="empty">Nenhuma opção disponível</div>'}

      <div class="success-message" id="successMsg">
        <div class="success-icon">✓ Obrigado!</div>
        <div class="success-text">Sua escolha foi registrada com sucesso. Entraremos em contato em breve com os próximos passos!</div>
      </div>

      <div class="button-group">
        <button class="btn btn-secondary" onclick="window.history.back()">← Voltar</button>
      </div>
    `;

    document.getElementById('content').innerHTML = html;
  }

  window.selectFare = async function(quoteId, fareId, index) {
    if (!db) return;
    
    try {
      const quoteRef = ref(db, 'orcamentos/' + quoteId);
      const snapshot = await get(quoteRef);
      const quote = snapshot.val();
      const fare = quote.fares[index];

      await update(quoteRef, {
        selection: {
          id: fare.id,
          label: fare.label,
          price: fare.price,
          selectedAt: Date.now()
        }
      });

      // Mostrar mensagem de sucesso
      const successMsg = document.getElementById('successMsg');
      successMsg.classList.add('show');

      // Desabilitar seleção de outras opções
      document.querySelectorAll('.option-card').forEach(el => {
        el.classList.add('disabled');
        el.onclick = null;
      });

      // Marcar a escolha visualmente
      document.querySelectorAll('.option-card').forEach(el => el.classList.remove('selected'));
      document.querySelector(`[data-fare="${fareId}"]`).classList.add('selected');

    } catch (e) {
      alert('Erro ao registrar sua escolha: ' + e.message);
    }
  };

  function formatCurrency(value) {
    return (parseFloat(value) || 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  loadQuote();
</script>

</body>
</html>
