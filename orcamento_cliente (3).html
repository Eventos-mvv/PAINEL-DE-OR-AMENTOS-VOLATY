      var(--charcoal-deep);
    color:var(--ink); font-family:'Manrope',sans-serif; min-height:100vh; padding:26px 16px 120px;
  }
  .wrap{ max-width:620px; margin:0 auto; }

  .center-msg{ max-width:420px; margin: 20vh auto; text-align:center; color:var(--muted); font-size:14px; line-height:1.6; }
  .center-msg .icon{ font-size:34px; margin-bottom:10px; }

  .brand-header{ display:flex; flex-direction:column; align-items:center; margin-bottom:18px; }
  .brand-logo-chip{
    background: rgba(247,245,243,0.95); border-radius:16px; padding:10px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); margin-bottom:4px;
  }
  .brand-logo{ height:40px; width:auto; display:block; }

  .agency{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:20px; }
  .agency-name{ font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .stamp{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.08em; color:var(--red);
    border:1px solid rgba(217,72,46,0.5); background: rgba(217,72,46,0.1); border-radius:999px; padding:5px 12px; text-transform:uppercase; }

  .client-hello{ font-size:13.5px; color:var(--muted); margin-bottom:14px; text-align:center; }
  .client-hello b{ color:var(--ink); }

  .route-card{ background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border:1px solid var(--line); border-radius:22px; padding:28px 22px 20px; position:relative; overflow:hidden;
    margin-bottom:18px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .route-top{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
  .airport{ text-align:center; width:92px; }
  .airport .code{ font-family:'Space Mono',monospace; font-weight:700; font-size:34px; letter-spacing:.02em; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
  .airport .city{ font-size:11px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.06em; }
  .path-mid{ flex:1; position:relative; height:46px; margin:0 6px; }
  .path-mid svg{ width:100%; height:100%; overflow:visible; }
  .path-line{ stroke: rgba(255,255,255,0.22); stroke-width:2; fill:none; stroke-dasharray:4 6; }
  .path-progress{ stroke:var(--red); stroke-width:2; fill:none; stroke-dasharray:300; stroke-dashoffset:300;
    animation: draw 1.8s .3s ease-out forwards; filter: drop-shadow(0 0 5px var(--red-glow)); }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .plane{ font-size:15px; animation: fly 2s .3s ease-out forwards;
    offset-path: path('M2,23 C60,2 140,2 198,23'); offset-rotate:auto; opacity:0; }
  @keyframes fly{ 0%{ offset-distance:0%; opacity:1; } 95%{ opacity:1; } 100%{ offset-distance:100%; opacity:1; } }
  .ida-tag{ position:absolute; top:-1px; left:50%; transform:translateX(-50%); font-family:'Space Mono',monospace;
    font-size:10px; letter-spacing:.12em; color:#fff; background:var(--red); padding:3px 10px 2px;
    border-radius:0 0 8px 8px; font-weight:700; z-index:2; }

  .board{ background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border:1px solid var(--line); border-radius:22px; padding:20px 20px 22px; margin-bottom:18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .board-title{ font-family:'Space Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:.14em;
    text-transform:uppercase; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .board-title .dot{ width:6px; height:6px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red-glow); }
  .flap-row{ display:flex; align-items:center; gap:14px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .flap-row:last-child{ border-bottom:none; }
  .flap-label{ width:76px; flex-shrink:0; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .flap-tiles{ display:flex; gap:3px; flex-wrap:wrap; }
  .flap-tile{ background: var(--glass-strong); border-radius:4px; width:20px; height:26px; display:flex; align-items:center;
    justify-content:center; font-family:'Space Mono',monospace; font-weight:700; font-size:15px; color:var(--ink);
    position:relative; box-shadow: inset 0 -1px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08); }
  .flap-tile::after{ content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.45); }
  .flap-tile.space{ background:transparent; }

  .fares-title{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; margin:6px 0 10px 4px; }
  .fare{ background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border:1.5px solid var(--line); border-radius:16px; padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; cursor:pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease; position:relative;
    box-shadow: 0 12px 30px rgba(0,0,0,.25); }
  .fare:hover{ border-color: rgba(217,72,46,0.5); }
  .fare.selected{ border-color:var(--red); background: linear-gradient(180deg, rgba(217,72,46,.22), rgba(217,72,46,.08)); }
  .fare:active{ transform: scale(0.995); }
  .fare-left{ display:flex; align-items:center; gap:12px; }
  .fare-icon{ width:38px; height:38px; border-radius:10px; background: var(--glass-strong); display:flex; align-items:center;
    justify-content:center; font-size:17px; flex-shrink:0; }
  .fare.selected .fare-icon{ background: var(--red); }
  .fare-name{ font-weight:700; font-size:14.5px; }
  .fare-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .fare-price{ font-family:'Space Mono',monospace; font-weight:700; font-size:16px; text-align:right; white-space:nowrap; }
  .fare-check{ width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); display:flex;
    align-items:center; justify-content:center; flex-shrink:0; margin-left:12px; font-size:12px; color:transparent;
    transition: all .15s ease; }
  .fare.selected .fare-check{ background:var(--red); border-color:var(--red); color:#fff; }

  .note{ font-size:11.5px; color:var(--muted); text-align:center; margin:16px 8px 0; line-height:1.5; }

  .summary{ position:fixed; left:0; right:0; bottom:0; background: rgba(28,29,30,0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top:1px solid var(--line); padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .summary-info .label{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .summary-info .value{ font-family:'Space Mono',monospace; font-weight:700; font-size:20px; }
  .summary-info .value .cents{ font-size:13px; color:var(--muted); }
  .cta{ background:var(--red); color:#fff; border:none; border-radius:12px; padding:13px 20px; font-weight:800;
    font-size:13.5px; cursor:pointer; font-family:'Manrope',sans-serif; white-space:nowrap;
    transition: transform .1s ease, filter .15s ease; box-shadow: 0 8px 24px var(--red-glow); }
  .cta:hover{ filter: brightness(1.08); }
  .cta:active{ transform: scale(0.97); }
  .cta:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
  .cta.confirmed{ background:var(--charcoal); box-shadow:none; }

  @media (max-width:420px){ .airport .code{ font-size:26px; } .airport{ width:74px; }
    .flap-tile{ width:16px; height:22px; font-size:12px; } .flap-label{ width:64px; font-size:10px; } }
  @media (prefers-reduced-motion: reduce){
    .path-progress, .plane{ animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; offset-distance:100% !important; } }
</style>
</head>

          <div class="agency">
            <div class="agency-name">${escapeHtml(data.agencyName || 'Agência de Viagens')}</div>
            <div class="stamp">Orçamento</div>
          </div>
          ${data.clientName ? `<div class="client-hello">Olá, <b>${escapeHtml(data.clientName)}</b> — aqui está seu orçamento de voo.</div>` : ''}
          <div class="route-card">
            <div class="ida-tag">${escapeHtml(data.tripType || 'IDA')}</div>
            <div class="route-top">
              <div class="airport"><div class="code">${escapeHtml(data.origin.code)}</div><div class="city">${escapeHtml(data.origin.city)}</div></div>
              <div class="path-mid">
                <svg viewBox="0 0 200 46" preserveAspectRatio="none">
                  <path class="path-line" d="M2,23 C60,2 140,2 198,23"></path>
                  <path class="path-progress" d="M2,23 C60,2 140,2 198,23"></path>
                </svg>
                <div class="plane">✈️</div>
              </div>
              <div class="airport"><div class="code">${escapeHtml(data.destination.code)}</div><div class="city">${escapeHtml(data.destination.city)}</div></div>
            </div>
          </div>
          <div class="board">
            <div class="board-title"><span class="dot"></span>Detalhes do voo</div>
            <div id="flapBoard"></div>
          </div>
          <div class="fares-title">Escolha a opção que preferir</div>
          <div id="fareList"></div>
          <div class="note">Valores sujeitos a confirmação de disponibilidade e variação de tarifa até a emissão. Preços em Reais (BRL).</div>
        </div>
        <div class="summary">
          <div class="summary-info"><div class="label">Total selecionado</div><div class="value" id="summaryValue">—</div></div>
          <button class="cta" id="ctaBtn" disabled>Escolher esta opção</button>
        </div>
      `;

      fareListEl = document.getElementById('fareList');
      currentSelectionId = data.selection ? data.selection.fareId : null;

      buildFlapBoard(data);
      renderFares(data.fares);
      updateSummary(data.fares);

      document.getElementById('ctaBtn').addEventListener('click', () => {
        if (!pendingFareId) return;
        const fare = data.fares.find(f => f.id === pendingFareId);
        quoteRef.child('selection').set({
          fareId: fare.id, label: fare.label, price: fare.price, selectedAt: Date.now()
        }).then(() => {
          const btn = document.getElementById('ctaBtn');
          btn.textContent = 'Opção confirmada ✓';
          btn.classList.add('confirmed');
        });
      });

      window._quoteFares = data.fares;
    }

    let pendingFareId = null;

    function renderFares(fares){
      fares = fares || window._quoteFares;
      fareListEl.innerHTML = '';
      fares.forEach(f => {
        const isSelected = f.id === (pendingFareId || currentSelectionId);
        const card = document.createElement('div');
        card.className = 'fare' + (isSelected ? ' selected' : '');
        card.setAttribute('role','button'); card.setAttribute('tabindex','0');
        card.innerHTML = `
          <div class="fare-left">
            <div class="fare-icon">${f.icon}</div>
            <div><div class="fare-name">${escapeHtml(f.label)}</div><div class="fare-sub">${escapeHtml(f.sub||'')}</div></div>
          </div>
          <div style="display:flex; align-items:center;">
            <div class="fare-price">R$ ${fmtBRL(f.price)}</div>
            <div class="fare-check">✓</div>
          </div>`;
        card.addEventListener('click', () => {
          pendingFareId = f.id;
          renderFares(fares);
          updateSummary(fares);
          const btn = document.getElementById('ctaBtn');
          btn.disabled = false;
          btn.textContent = 'Escolher ' + f.label;
          btn.classList.remove('confirmed');
        });
        fareListEl.appendChild(card);
      });
    }

    function updateSummary(fares){
      fares = fares || window._quoteFares;
      const activeId = pendingFareId || currentSelectionId;
      const summaryEl = document.getElementById('summaryValue');
      const btn = document.getElementById('ctaBtn');
      if (!activeId || !fares) { if(summaryEl) summaryEl.textContent = '—'; return; }
      const fare = fares.find(f => f.id === activeId);
      if (!fare || !summaryEl) return;
      const parts = fmtBRL(fare.price).split(',');
      summaryEl.innerHTML = 'R$ ' + parts[0] + '<span class="cents">,' + parts[1] + '</span>';
      if (currentSelectionId && !pendingFareId) {
        btn.disabled = true;
        btn.textContent = 'Opção confirmada ✓';
        btn.classList.add('confirmed');
      }
    }

    const FLAP_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 →:/".split('');
    function randChar(){ return FLAP_CHARS[Math.floor(Math.random()*FLAP_CHARS.length)]; }

    function buildFlapBoard(data){
      const boardRows = [
        { label: 'Data', text: data.date || '' },
        { label: 'Trajeto', text: data.origin.code + ' → ' + data.destination.code },
        { label: 'Partida', text: data.departure || '' },
        { label: 'Chegada', text: data.arrival || '' },
        { label: 'Voo', text: (data.airline||'') + ' ' + (data.flightNumber||'') },
      ];
      const boardEl = document.getElementById('flapBoard');
      let allTiles = [];
      boardRows.forEach(r => {
        const row = document.createElement('div'); row.className = 'flap-row';
        const lab = document.createElement('div'); lab.className = 'flap-label'; lab.textContent = r.label;
        row.appendChild(lab);
        const tiles = document.createElement('div'); tiles.className = 'flap-tiles';
        r.text.split('').forEach(ch => {
          const tile = document.createElement('div');
          tile.className = 'flap-tile' + (ch === ' ' ? ' space' : '');
          tile.textContent = ch === ' ' ? '' : randChar();
          tiles.appendChild(tile);
          allTiles.push({el: tile, final: ch});
        });
        row.appendChild(tiles);
        boardEl.appendChild(row);
      });

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) {
        allTiles.forEach(t => { if(t.final !== ' ') t.el.textContent = t.final; });
      } else {
        allTiles.forEach((t, i) => {
          if (t.final === ' ') return;
          const spins = 6 + Math.floor(Math.random()*5);
          let count = 0;
          setTimeout(() => {
            const iv = setInterval(() => {
              count++;
              if (count >= spins) { clearInterval(iv); t.el.textContent = t.final; }
              else t.el.textContent = randChar();
            }, 45);
          }, i * 22);
        });
      }
    }

    function escapeHtml(str){
      return (str || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  }
